[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "migros-mcp"
version = "0.2.0"
description = "Unofficial MCP server for Migros Sanal Market (migros.com.tr) — product search, prices, promos, categories, cart actions"
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "curl-cffi>=0.7,<1.0",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
migros-mcp = "migros_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/migros_mcp"]
